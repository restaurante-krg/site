<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KRG - Restaurante</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

    <style>
        body{
          margin:0;
          font-family:Arial, Helvetica, sans-serif;
          background:linear-gradient(to bottom, #000, #111);
          color:#fff;
        }

        /* HERO */
        .hero{
          min-height:80vh;
          display:flex;
          flex-direction:column;
          justify-content:center;
          align-items:center;
          text-align:center;
          padding:30px 20px;
        }

        .hero img{
          width:120px;
          margin-bottom:20px;
        }

        .hero h1{
          font-size:2rem;
          margin-bottom:10px;
        }

        .hero p{
          color:#ccc;
          margin-bottom:30px;
        }

        /* BOTÕES */
        .hero .btn{
          width:100%;
          max-width:300px;
          margin-bottom:15px;
          font-size:1.1rem;
          padding:12px;
        }

        /* FOOTER */
        .footer{
          text-align:center;
          padding:20px;
          font-size:0.85rem;
          color:#777;
        }
    </style>
</head>

<body>

<!-- HERO -->
<section class="hero">
    <img src="assets/img-profile.png" alt="KRG">

    <h1>Bem-vindo ao KRG</h1>
    <p>Comida caseira, sabor de verdade 🍽️</p>

    <a href="cardapio.html" class="btn btn-danger">
        Ver Cardápio
    </a>

    <a href="feedback.html" class="btn btn-outline-secondary">
        Avaliar Atendimento
    </a>
    <a>
        <div class="info-box">
            <div id="openStatus">Carregando status...</div>

            <div class="hours">
                ⏰ Seg a Sáb: 06:00 às 20:00<br>
                🚫 Domingo: fechado
            </div>
        </div>
    </a>
    <a
            href="https://www.google.com/maps/place/Lanchonete+e+Restaurante+KRG/@-23.5773531,-46.5520237,17z/data=!3m1!4b1!4m6!3m5!1s0x94ce5d25c11e9619:0x8c5f80dc5eed6f74!8m2!3d-23.5773531!4d-46.5494488!16s%2Fg%2F11gmfytspf?entry=ttu&g_ep=EgoyMDI2MDEyOC4wIKXMDSoASAFQAw%3D%3D"
            target="_blank"
            class="btn btn-outline-light"
            style="margin-top:15px;"
    >
        📍 Ver localização
    </a>
</section>

<!-- FOOTER -->
<div class="footer">
    © 2026 - KRG Restaurante
</div>

</body>
<script>
function checkOpenStatus(){
  const now = new Date();
  const day = now.getDay();   // 0 = domingo
  const hour = now.getHours();

  let isOpen = false;

  // Segunda (1) a Sábado (6)
  if(day >= 1 && day <= 6){
    if(hour >= 6 && hour < 20){
      isOpen = true;
    }
  }

  // Domingo (0) fica automaticamente fechado

  const status = document.getElementById('openStatus');

  if(isOpen){
    status.textContent = '🟢 Aberto agora';
    status.style.color = '#28a745';
  } else if(day === 0){
    status.textContent = '🔴 Fechado • Domingo não abrimos';
   } else {
    status.textContent = '🔴 Fechado • Abrimos às 06:00';
    status.style.color = '#dc3545';
  }


}

checkOpenStatus();
</script>
</html>
