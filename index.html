<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KRG - Restaurante</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

    <style>
        body{
          margin:0;
          font-family:Arial, Helvetica, sans-serif;
          background:linear-gradient(to bottom, #000, #111);
          color:#fff;
        }

        /* HERO */
        .hero{
          min-height:80vh;
          display:flex;
          flex-direction:column;
          justify-content:center;
          align-items:center;
          text-align:center;
          padding:30px 20px;
        }

        .hero img{
          width:120px;
          margin-bottom:20px;
        }

        .hero h1{
          font-size:2rem;
          margin-bottom:10px;
        }

        .hero p{
          color:#ccc;
          margin-bottom:30px;
        }

        /* BOTÕES */
        .hero .btn{
          width:100%;
          max-width:300px;
          margin-bottom:15px;
          font-size:1.1rem;
          padding:12px;
        }

        /* FOOTER */
        .footer{
          text-align:center;
          padding:20px;
          font-size:0.85rem;
          color:#777;
        }
    </style>
</head>

<body>

<!-- HERO -->
<section class="hero">
    <img src="assets/img-profile.png" alt="KRG">

    <h1>Bem-vindo ao KRG</h1>
    <p>Comida caseira, sabor de verdade 🍽️</p>

    <a href="cardapio.html" class="btn btn-danger">
        Ver Cardápio
    </a>

    <a href="feedback.html" class="btn btn-outline-secondary">
        Avaliar Atendimento
    </a>
</section>

<!-- FOOTER -->
<div class="footer">
    © 2026 - KRG Restaurante
</div>

</body>
</html>
